name: chat-com-documentos

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrepõe o DATABASE_URL do .env para gravar num volume nomeado,
      # assim os dados sobrevivem a rebuilds/recriação do container.
      - DATABASE_URL=sqlite:////app/data/app.db
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  backend_data:
